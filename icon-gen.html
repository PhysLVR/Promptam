<!doctype html>
<html><head><meta charset="utf-8"><title>Icon Gen</title></head>
<body style="background:#111;color:#eee;font-family:sans-serif;padding:20px;text-align:center">
<h2>Icon Generator</h2>
<p>روی هر دکمه بزن → PNG دانلود می‌شه → بذار تو پوشهٔ icons/</p>
<div id="out"></div>
<script>
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<path fill="#0b0f1e" d="M40 6 A 5 5 0 0 0 36.587891 14.650391L32.976562 21.191406 A 11 11 0 0 0 31 21 A 11 11 0 0 0 24.919922 22.841797L16.455078 15.875 A 5.5 5.5 0 0 0 11.5 8 A 5.5 5.5 0 0 0 11.5 19 A 5.5 5.5 0 0 0 14.132812 18.328125L21.539062 26.414062 A 11 11 0 0 0 21.09375 36.761719L14.410156 43.070312 A 6 6 0 0 0 11 42 A 6 6 0 0 0 11 54 A 6 6 0 0 0 16.554688 45.751953L24.173828 40.613281 A 11 11 0 0 0 31 43 A 11 11 0 0 0 33.808594 42.621094L38.318359 49.625 A 5 5 0 0 0 42 58 A 5 5 0 0 0 42 48 A 5 5 0 0 0 41.332031 48.050781L38.144531 40.359375 A 11 11 0 0 0 41.105469 36.316406L47.042969 36.685547 A 6 6 0 0 0 53 42 A 6 6 0 0 0 53 30 A 6 6 0 0 0 47.662109 33.261719L41.984375 31.521484 A 11 11 0 0 0 37.46875 23.109375L39.708984 15.988281 A 5 5 0 0 0 40 16 A 5 5 0 0 0 40 6 z"/>
</svg>`;

function make(size, maskable, name) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#a78bfa";
  ctx.fillRect(0, 0, size, size);
  const pad = maskable ? size * 0.15 : size * 0.08;
  const inner = size - pad * 2;
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, pad, pad, inner, inner);
    const a = document.createElement("a");
    a.href = c.toDataURL("image/png");
    a.download = name;
    a.textContent = "⬇ " + name;
    a.style.cssText = "display:block;margin:12px auto;padding:12px 24px;background:#a78bfa;color:#000;border-radius:8px;text-decoration:none;font-weight:bold;width:fit-content";
    document.getElementById("out").appendChild(a);
  };
  img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

make(192, false, "icon-192.png");
make(512, false, "icon-512.png");
make(512, true,  "icon-maskable-512.png");
</script>
</body></html>
